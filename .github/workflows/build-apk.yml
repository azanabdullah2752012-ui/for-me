name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build FOR ME Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK and Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Build web application for Android
        env:
          CAPACITOR_BUILD: 'true'
        run: npm run build

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx cap update android || true
          npx cap copy android || true

      - name: Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Package APK
        run: |
          echo "=== Searching for generated APK files ==="
          find android/ -name "*.apk" -print
          APK_PATH=$(find android/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file was found anywhere in android/!"
            exit 1
          fi
          echo "Selected APK: $APK_PATH"
          mkdir -p output-apk
          cp "$APK_PATH" output-apk/FOR-ME-v2.1.0-debug.apk
          ls -lh output-apk/FOR-ME-v2.1.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOR-ME-v2.1.0-Android-APK
          path: output-apk/FOR-ME-v2.1.0-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-apk
          name: "FOR ME — Android App (v2.1.0 APK)"
          body: |
            ### FOR ME — Private Life Ledger & Personal Sanctuary
            **Ready-to-install Android APK file for Samsung Galaxy F13 and all modern Android devices.**

            #### How to Install on Samsung Galaxy F13:
            1. Tap **`FOR-ME-v2.1.0-debug.apk`** under Assets below to download it directly to your phone.
            2. Open the Samsung **My Files** app (or tap the download notification in your notification bar).
            3. Tap **Downloads** -> **`FOR-ME-v2.1.0-debug.apk`**.
            4. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and turn **"Allow from this source"** ON.
            5. Tap **Install**, then **Open**!
          files: output-apk/FOR-ME-v2.1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
